name: flickbee_delivery_partner
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.10.4
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  connectivity_plus: ^6.1.3
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  elegant_notification: ^2.4.3
  intl: ^0.20.2
  firebase_core: 
  firebase_auth: 
  cloud_firestore: 
  firebase_storage:
  image_picker: ^1.1.2
  flutter_riverpod: ^3.1.0
  custom_navigation_bar: ^0.8.2
  flutter_image_compress: ^2.4.0
  shared_preferences: ^2.5.3
  permission_handler: ^12.0.0+1
  uuid: ^4.5.1
  flutter_svg: ^2.1.0
  lottie: ^3.3.1
  sizer: ^3.1.3
  google_maps_flutter: ^2.14.0
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  flutter_slidable: ^4.0.3
  camera: ^0.11.3
  signature: ^6.3.0
  google_fonts: ^7.0.0




dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/

  fonts:
    - family: Gilroy
      fonts:
        # - asset: assets/fonts/gilroy/Gilroy-Thin.ttf
        #   weight: 100
        # - asset: assets/fonts/gilroy/Gilroy-UltraLight.ttf
        #   weight: 200
        # - asset: assets/fonts/gilroy/Gilroy-Light.ttf
        #   weight: 300
        # - asset: assets/fonts/gilroy/Gilroy-Regular.ttf
        #   weight: 400
        - asset: assets/fonts/gilroy/Gilroy-Medium.ttf
          weight: 500
        - asset: assets/fonts/gilroy/Gilroy-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/gilroy/Gilroy-Bold.ttf
          weight: 700
        - asset: assets/fonts/gilroy/Gilroy-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/gilroy/Gilroy-Black.ttf
          weight: 900